<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fundraiser Stats</title>
  <style>
    :root { --bg: #f5f5f4; --card: #fff; --text: #1c1917; --muted: #57534e; --border: #e7e5e4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --card: #292524; --text: #f5f5f4; --muted: #a8a29e; --border: #44403c; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem; }
    h1 { margin: 0 0 1rem; font-size: 1.75rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: .75rem; padding: .5rem 1.25rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .5rem .5rem .5rem 0; text-align: left; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: 0; }
    th { color: var(--muted); font-weight: 600; font-size: .875rem; }
    td a { color: inherit; overflow-wrap: anywhere; }
    .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <h1>Stats</h1>
    <section class="card">
      <table>
        <tr><th>Fundraiser</th><th class="num">Polls</th><th class="num">Last poll (UTC)</th></tr>
        {{range .}}
        <tr>
          <td>{{if eq .Key "kentaa"}}/kentaa{{else}}<a href="https://{{.Key}}">{{.Key}}</a>{{end}}</td>
          <td class="num">{{.Polls}}</td>
          <td class="num">{{.LastPoll.Format "2006-01-02 15:04"}}</td>
        </tr>
        {{else}}
        <tr><td colspan="3" class="muted">No polls yet.</td></tr>
        {{end}}
      </table>
    </section>
  </main>
</body>
</html>
