<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fundraiser widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    body { margin: 0; background: transparent; }
    #amount { font-size: 32px; font-weight: 700; font-family: system-ui, sans-serif; opacity: 0; transition: opacity .3s; }
  </style>
</head>
<body>
  <div id="amount"></div>

  <script>
    // Shows a fundraiser's live total: ?url=<fundraiser page>, or the /kentaa fundraiser without it.
    // Optional styling: &color=ffffff&size=64&font=Bebas+Neue&goal=1
    const params = new URLSearchParams(location.search);
    const page = params.get("url");
    const api = page ? "/fundraiser?url=" + encodeURIComponent(page) : "/kentaa";
    const amount = document.getElementById("amount");
    const euros = n => Math.floor(n).toLocaleString("fi-FI") + " €";

    // Google Fonts the widget offers: name -> [css2 family query, weight].
    const fonts = {
      "Syncopate": ["Syncopate:wght@700", 700],
      "Montserrat": ["Montserrat:wght@800", 800],
      "Bebas Neue": ["Bebas+Neue", 400],
      "Press Start 2P": ["Press+Start+2P", 400],
    };
    const font = params.get("font") || "Syncopate";
    let fontReady = Promise.resolve();
    if (font in fonts) {
      const [query, weight] = fonts[font];
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = `https://fonts.googleapis.com/css2?family=${query}&display=swap`;
      fontReady = new Promise(resolve => link.onload = link.onerror = resolve)
        .then(() => document.fonts.load(`${weight} 1em "${font}"`, "0123456789 €/"));
      document.head.append(link);
      amount.style.fontFamily = `"${font}", sans-serif`;
      amount.style.fontWeight = weight;
    }
    if (params.has("color")) amount.style.color = "#" + params.get("color");
    if (params.has("size")) amount.style.fontSize = params.get("size") + "px";

    async function update() {
      try {
        const res = await fetch(api);
        if (!res.ok) return;
        const data = await res.json();
        const goal = params.has("goal") && data.target_amount ? " / " + euros(data.target_amount) : "";
        amount.textContent = euros(parseFloat(data.total_amount)) + goal;
      } catch {
        // Keep showing the last amount until the next update.
      }
    }

    // Fade in once the font and first amount are in, so the widget doesn't jump on load.
    // Shows anyway after 3 seconds if either is slow.
    const show = () => amount.style.opacity = 1;
    Promise.race([Promise.all([fontReady, update()]), new Promise(resolve => setTimeout(resolve, 3000))])
      .then(show, show);
    setInterval(update, 10000);
  </script>
</body>
</html>
